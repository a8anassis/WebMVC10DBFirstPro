services:
  sqlservermvc:
    image: mcr.microsoft.com/mssql/server:${SQL_IMAGE_TAG}
    container_name: sqlserver10mvc
    hostname: sqlserver10mvc-docker
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "${MSSQL_PORT}:1433"
    volumes:
      - sqlserver10mvc-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
 
volumes:
  sqlserver10mvc-data: